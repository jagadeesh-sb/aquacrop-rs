name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Debian 12 (glibc 2.36): the reference figures in docs/validation.md were
    # measured here. On ubuntu-latest two scenarios differ in daily soil water.
    container: python:3.12-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reference runs from AquaCrop-OSPy
        # numpy uses AVX-512 versions of exp/log on CPUs that have them, and
        # those can round the last bit differently. The published figures
        # were made without AVX-512, so it is switched off here.
        env:
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          grep -m1 "model name" /proc/cpuinfo
          pip install aquacrop==3.1.0 numpy==2.5.4 pandas==3.0.6
          python -c "import numpy; numpy.show_runtime()"
          python -W ignore scripts/golden.py
      - name: Unit and reference tests
        run: cargo test --release
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: WebAssembly build
        run: |
          cargo build --profile wasm --target wasm32-unknown-unknown --features wasm
          V=$(cargo pkgid -p wasm-bindgen | sed 's/.*@//')
          cargo install wasm-bindgen-cli --version "$V" --locked
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/wasm/aquacrop.wasm
          ls -l pkg
      - name: WebAssembly against the reference runs
        run: node scripts/wasm-check.mjs
